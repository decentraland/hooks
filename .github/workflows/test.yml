name: Test

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm ci

      - name: Install React 18
        if: matrix.react == 18
        run: npm install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1 @types/react@18.3.18 @types/react-dom@18.3.5

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

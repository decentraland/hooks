name: Build

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Use Node.js 20.x
        uses: actions/setup-node@v1
        with:
          node-version: 24
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
